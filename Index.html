<style>
    .btn-45 {
    position: relative;
    padding: 12px 20px;
    font-size: 14px;
    font-family: Arial, Helvetica, sans-serif;
    display: inline-block;
    user-select: none;
    cursor: pointer;
    border: solid 0px;
    letter-spacing: 1.2px;
    font-weight: bold;
    /*** full width block ***/
    /* width: 100%; */
}

.btn-45 {
    --thickness: 4px;
    clip-path: polygon(0 0, 100% 0, 100% calc(100% + var(--thickness)),  0 calc(100% + var(--thickness)));
    -webkit-mask-image: none;
}

.btn-45-colors {
    background:transparent;
    border-color: #ffffff;
    color: #ffffff;
}

.btn-45:before {
    background: #ffffff;
    bottom: calc(var(--thickness) * -1);
    content: "";
    display: block;
    height: var(--thickness);
    left: 0;
    pointer-events: none;
    position: absolute;
    width: 100%;
}

.btn-45:hover:before {
    animation: slide-45 0.5s ease;
}

.btn-45:disabled {
    pointer-events: none;
    opacity: .65;
    color: #7e7e7e;
    background: #dcdcdc;
}

.btn-45:disabled:before {
    background: #c2bebe;
}

@keyframes slide-45 {
    0% {
        transform: translateX(0);
    }

    50% {
        transform: translateX(100%);
    }

    51% {
        transform: translateX(-100%);
    }

    100% {
        transform: translateX(0);
    }
}
